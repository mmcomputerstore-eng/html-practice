<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <input type="text" placeholder="Name">
        <input type="email" placeholder="Email">
        <input type="password" placeholder="Password">
        <h4>Gender</h4>
        <label>
            <input type="radio" name="gender" value="Male" id="g1">Male
        </label>
        <label>
            <input type="radio" name="gender" value="Female" id="g2">Female
        </label>
        <h4>Education</h4>
        <label>
            <input type="radio" name="Education" value="Matric" id="e1">Matric
        </label>
        <label>
            <input type="radio" name="Education" value="Intermediate" id="e2">Intermediate
        </label>
        <label>
            <input type="radio" name="Education" value="Bachelor" id="e3">Bachelor
        </label>
        <h4>Courses</h4>
        <label>
            <input type="checkbox" name="Courses" value="Python" id="c1">Python
        </label>
        <label>
            <input type="checkbox" name="Courses" value="HTML" id="c2">HTML
        </label>
        <label>
            <input type="checkbox" name="Courses" value="CSS" id="c3">CSS1
        </label>
        <label>
            <input type="checkbox" name="Courses" value="SQL" id="c4">SQL
        </label>
        <h4>Preferrerd Learning Time</h4>
        <label>
            <input type="radio" name="Time" value="Morning" id="t1">Morning
        </label>
        <label>
            <input type="radio" name="Time" value="Afternoon" id="t2">Afternoon
        </label>
        <label>
            <input type="radio" name="Time" value="Evening" id="t3">Evening
        </label><br>
        <textarea name="About" placeholder="About Stoudent..."></textarea><br>
        <input type="submit" name="submit">
    </form>
</body>
</html>
