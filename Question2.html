<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <input type="text" placeholder="Full Name"><br>
        <input type="email" placeholder="Email"><br>
        <input type="password" placeholder="password"><br>
        <h4>Gender</h4>
        <label >
            <input type="radio" name="Gender" value="Male" id="101">Male
        </label>
        <label >
            <input type="radio" name="Gender" value="Female" id="102">Female
        </label><br>
        <h4>Education</h4>
        <label>
            <input type="radio" name="Education" value="Matric" id="e1">Matric
        </label>
        <label>
            <input type="radio" name="Education" value="Intermediate" id="e2">Intermediate
        </label>
        <label>
            <input type="radio" name="Education" value="Bachelor" id="e3">Bachelor
        </label>
        <label>
            <input type="radio" name="Education" value="Master" id="e4">Master
        </label>
        <h4>Skills</h4>
        <label><input type="checkbox" name="Skills" value="Python" id="s1">Python </label>
        <label><input type="checkbox" name="Skills" value="HTML" id="s2">HTML </label>
        <label><input type="checkbox" name="Skills" value="CSS" id="s3">CSS </label>
        <label><input type="checkbox" name="Skills" value="SQL" id="s4">SQL </label><br>
        <textarea name="about" id="about" placeholder="Type somthing About You..." rows="5"></textarea><br>
        <input type="submit" value="submit">
    </form>
</body>
</html>
