<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <input type="text" name="coustomer_name" placeholder="Coustomer Name"><br>
        <input type="number" name="Phone" placeholder="Type Phone Without (-)"><br>
        <input type="email" name="email" placeholder="Eamil"><br>
        <input type="password" name="password" placeholder="password"><br>
        <h4>Product</h4>
            <select name="Product">
                <option value="Laptop">Laptop</option>
                <option value="Desktop">Desktop</option>
                <option value="Monitor">Monitor</option>
                <option value="Keyboard">Keyboard</option>
            </select>
        <h4>Payment Method</h4>
        <label>
            <input type="radio" name="Payment" value="Cash" id="pm1">Cash
        </label>
        <label>
            <input type="radio" name="Payment" value="Bank Transfer" id="pm2">Bank Transfer
        </label>
        <label>
            <input type="radio" name="Payment" value="Card" id="pm3">Card
        </label><br>
        <label>
            <input type="checkbox" name="Accessories" value="Mouse" id="a1">Mouse
        </label>
        <label>
            <input type="checkbox" name="Accessories" value="Keyboard" id="a2">Keyboard
        </label>
        <label>
            <input type="checkbox" name="Accessories" value="Headphones" id="a3">Headphones
        </label><br>
        <textarea name="Coustomer Address" placeholder="Coustomer Address" rows="5"></textarea><br>
        <input type="submit" name="submit">
    </form>
</body>
</html>
