<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <input type="text"  placeholder="Name"><br>
        <input type="email" placeholder="Eamil">
        <h4>Gender</h4>
        <label>
            <input type="radio" name="Gender" value="Male" >Male
        </label>
        <label>
            <input type="radio" name="Gender" value="Female" >Female
        </label>
        <h4>How did you find us?</h4>
        <label>
            <input type="radio" name="find" value="Google" id="f1" >Google
        </label>
        <label>
            <input type="radio" name="find" value="Facebook" id="f2" >Facebook
        </label>
        <label>
            <input type="radio" name="find" value="YouTube" id="f3" >YouTube
        </label>
        <label>
            <input type="radio" name="find" value="Friend" id="f4" >Friend
        </label>
        <h4>What did you like?</h4>
        <label>
            <input type="checkbox" name="like" value="Design" id="l1">Design
        </label>
        <label>
            <input type="checkbox" name="like" value="Speed" id="l2">Speed
        </label>
        <label>
            <input type="checkbox" name="like" value="Products" id="l3">Products
        </label>
        <label>
            <input type="checkbox" name="like" value="Price" id="l4">Price
        </label>
        <h4>Your Feedback:</h4>
        <textarea name="feedback" placeholder="Type your valueable feedback..."></textarea><br>
        <input type="submit" value="submit">
    </form>
</body>
</html>
